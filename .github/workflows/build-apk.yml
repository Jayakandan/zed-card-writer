name: Build APK

# Builds the installable APK on GitHub's runners and attaches it to the run.
#
# NOTE: there is deliberately NO android-actions/setup-android step here.
# That action tries to install the SDK package called "tools", which Google
# removed from the repository years ago, so it fails with
#     Warning: Failed to find package 'tools'
#     Error: The process '.../sdkmanager' failed with exit code 1
# It is not needed anyway - ubuntu-latest already ships the Android SDK at
# $ANDROID_SDK_ROOT with its licences pre-accepted.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # lets you press "Run workflow" in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show the preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      # Insurance only: if the runner image happens not to carry the exact
      # platform/build-tools this project compiles against, install them with
      # the SDK manager that is already on the image. Cheap, and it keeps the
      # build working when GitHub rotates the runner image.
      - name: Ensure the SDK packages this project needs
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # gradle-version is REQUIRED here: this project has no gradle wrapper
      # (no gradlew / gradle-wrapper.jar committed), so without an explicit
      # version there would be no gradle on PATH for the build steps below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show what was built
        run: find . -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZedCardWriter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZedCardWriter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
