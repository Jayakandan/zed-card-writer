name: Build APK

# Builds the installable APK on GitHub's runners, which already have the
# Android SDK. Runs on every push, and can be started by hand from the
# Actions tab. The finished APK is attached to the run as an artifact.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # lets you press "Run workflow" in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show what was built
        run: find . -name "*.apk" -print -exec ls -lh {} \;

      # Two artifacts so you can grab whichever you want. The debug one
      # installs alongside the release one (different applicationId), which is
      # handy when testing a change against a known-good build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZedCardWriter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZedCardWriter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
