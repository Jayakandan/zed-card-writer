plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Every credential below is read from an environment variable at build time.
// Locally it falls back to a harmless placeholder so the app still compiles
// without secrets. In CI these come from GitHub Actions repo secrets -
// see .github/workflows/build-apk.yml. Nothing secret is ever committed.
def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    namespace 'com.zeddigital.cardwriter'
    compileSdk 34

    defaultConfig {
        applicationId "com.zeddigital.cardwriter"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"

        buildConfigField "String", "LOGIN_USERNAME",
                "\"${env('LOGIN_USERNAME', 'admin')}\""
        // SHA-256 of the password, never the plaintext password itself.
        // Default below is the hash of "changeme" - change it before shipping.
        buildConfigField "String", "LOGIN_PASSWORD_SHA256",
                "\"${env('LOGIN_PASSWORD_SHA256', '057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86')}\""

        buildConfigField "String", "DATA_API_URL", "\"${env('DATA_API_URL', '')}\""
        buildConfigField "String", "DATA_API_KEY", "\"${env('DATA_API_KEY', '')}\""
        buildConfigField "String", "DATA_SOURCE", "\"${env('DATA_SOURCE', 'Cluster0')}\""
        buildConfigField "String", "DATABASE_NAME", "\"${env('DATABASE_NAME', 'admin')}\""
        buildConfigField "String", "COLLECTION_NAME", "\"${env('COLLECTION_NAME', 'topups')}\""
    }

    signingConfigs {
        debug {
            // A fixed debug keystore so every CI build is signed identically
            // and installs cleanly over the previous one.
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Deliberately dependency-free: framework HttpURLConnection + org.json
    // for the database call, framework ObjectAnimator for the animations.
    // Nothing here needs a version to resolve, which keeps CI builds reliable.
}
